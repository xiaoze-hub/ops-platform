# ops-platform nginx — local/dev reverse proxy config
#
# PRODUCTION NOTE (国内机):
#   Do NOT open another 80/443 on the deploy host. Production should reuse
#   the EXISTING nginx already listening on 80/443 and add a server block
#   that reverse-proxies this platform (host port 8081). Example server
#   block for ops.sida.win is in the root README.md.
#   This container nginx is only for local `docker compose up` / isolated
#   environments without a pre-existing edge nginx.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip on
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Reverse proxy /api/ -> FastAPI platform:8081 (HTTP + WebSocket)
    location /api/ {
        proxy_pass http://platform:8081;
        proxy_http_version 1.1;

        # WebSocket Upgrade (WS log stream: /api/v1/nodes/{id}/logs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WS / slow streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Static frontend if present (optional; API-only works without it)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# map used by Connection header above (defined in http context of conf.d include)
# nginx:alpine main config includes conf.d/*.conf inside http {}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
